# SPDX-License-Identifier: GPL-3.0-or-later
name: eta-mu evidence review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Evidence-first review (eta-mu)
    uses: open-hax/eta-mu/.github/workflows/opencode-code-review.yml@7112c36440d180ca183d6a3f89661cee161fdae5
    with:
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      review_timeout_minutes: 120
      model: opencode/mimo-v2.6-flash-free
      muse_revision: c1369c223cf3c57e3e31934a6d746bfcdfe73f5a
      agents_revision: 7ab2f99e048e370f5f943acc2321b8294402e786
      opencode_version: 1.18.31
      node_version: "22.20.0"
      setup_eta_mu_toolchain: true
      evidence_gates_script: |
        run_gate diff_stat git diff --stat "${PR_BASE_SHA}...HEAD"
        run_gate diff_hygiene git diff --check "${PR_BASE_SHA}...HEAD"
        run_gate install npm ci --no-audit --no-fund
        install_status="$(awk -F= '$1 == "install" {print $2}' "$statuses")"
        if [[ "$install_status" == "0" ]]; then
          # boundary:check is not a gate yet: main has 53 existing JS-boundary
          # violations. Add it once they are fixed.
          run_gate test npm test
          run_gate build npm run build
        else
          echo "test=125" >> "$statuses"
          echo "build=125" >> "$statuses"
          echo "Dependency installation failed; test and build were not attempted." >> "$log"
        fi
    secrets:
      ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
      ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
