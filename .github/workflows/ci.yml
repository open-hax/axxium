name: CI

on:
  pull_request:
    branches: [main, staging, 'sync/**']
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  mutation-pilot-boundaries:
    name: mutation-pilot-boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
      - name: Verify mutation runner, external harness and test-phase contracts
        run: AXXIUM_QUAL_TEST_NODE="$(node -p process.execPath)" python3 -m unittest discover -s qualification -p 'test_*.py' -v

  deployment-boundary:
    name: deployment-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject retired deployment authority
        run: |
          node scripts/check-deployment-boundary.mjs --self-test
          node scripts/check-deployment-boundary.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify Compose shutdown grace
        run: npm run test:compose

      - name: Install isolated PostgreSQL test tools
        run: |
          if ! command -v pg_config >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
          echo "AXXIUM_TEST_PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"

      - name: Verify durable shared-login authority
        run: npm run test:oidc-store
